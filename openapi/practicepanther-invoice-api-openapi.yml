    RecurringPayment:
      required:
      - account
      - description
      - paymentSource
      - bankAccount
      type: object
      properties:
        guid:
          format: uuid
          type: string
          example: 00000000-0000-0000-0000-000000000000
        lawPayTokenId:
          type: string
        headNoteId:
          type: string
        accountId:
          format: int64
          type: integer

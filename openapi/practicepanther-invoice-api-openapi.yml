openapi: 3.0.0
info:
  version: v1
  title: Legacy API (v1) Account Invoice API
  description: ''
servers:
- url: https://app.practicepanther.com
tags:
- name: Invoice
paths:
  /api/invoice/{guid}:
    get:
      tags:
      - Invoice
      summary: Returns an invoice
      operationId: Invoice_GetInvoice
      parameters:
      - name: guid
        in: path
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDocumentDTO_Detail'
            text/json:
              schema:
                $ref: '#/components/schemas/SaleDocumentDTO_Detail'
      security:
      - oauth2:
        - full
  /api/invoice:
    get:
      tags:
      - Invoice
      summary: OData end point to get a list of all invoices accessible by the user
      operationId: Invoice_GetInvoices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleDocumentDTO'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleDocumentDTO'
      security:
      - oauth2:
        - full
    delete:
      tags:
      - Invoice
      summary: Marks an existing invoice as deleted, will remove all amounts applied on invoices.
      operationId: Invoice_DeleteInvoice
      parameters:
      - name: guid
        in: query
        description: ''
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDocumentDTO_Detail'
            text/json:
              schema:
                $ref: '#/components/schemas/SaleDocumentDTO_Detail'
      security:
      - oauth2:
        - full
